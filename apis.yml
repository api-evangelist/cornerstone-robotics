aid: cornerstone-robotics
name: Cornerstone Robotics
description: 'Cornerstone Robotics (CSR) is a Hong Kong-headquartered surgical robotics
  manufacturer founded in 2019 at Hong Kong Science Park, building the Sentire Endoscopic
  Surgical System (C1000) — a multi-specialty, minimally invasive robot-assisted surgery
  platform developed entirely in-house and indicated for general surgery, gynecology,
  thoracic and urology. The Sentire system has received regulatory clearance in China
  (NMPA), the European Union and Singapore, and has completed multicenter clinical
  trials in China and the United Kingdom. The company operates three global R&D hubs,
  six business centers and a 30,000 square meter manufacturing facility, and sells a
  regulated physical medical device rather than software: it publishes no developer
  portal, no public API, no SDKs and no machine-readable specifications.'
